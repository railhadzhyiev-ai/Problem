name: Verify diagnostic source snapshot
on:
  push:
    paths:
      - .github/workflows/build-diagnostic-snapshot.yml
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source blobs and frozen input; run offline controls
        shell: python
        run: |
          import pathlib,json,hashlib,subprocess,re
          root=pathlib.Path.cwd()
          m=json.loads((root/'PROVENANCE.json').read_text())
          for entry in m['sourceFiles']:
              b=(root/entry['path']).read_bytes()
              assert len(b)==entry['bytes'], 'Byte-length drift: '+entry['path']
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==entry['gitBlobSha'], 'Source blob drift: '+entry['path']
              entry['sha256']=hashlib.sha256(b).hexdigest()
          (root/'PROVENANCE.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          for line in (root/'backend/benchmark/canonicalword-ai-pilot-v1/checksums.v1.sha256').read_text().splitlines():
              h,n=line.split(None,1)
              p=root/'backend/benchmark/canonicalword-ai-pilot-v1'/n.strip()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h, 'Frozen input checksum mismatch'
          rows=(root/'backend/benchmark/canonicalword-ai-pilot-v1/pilot-input.v1.jsonl').read_text().strip().splitlines()
          assert len(rows)==100
          for row in rows:assert json.loads(row)['candidate']['targetLanguage']=='de'
          tests=['backend/test/canonicalword-replay-v2.test.mjs','backend/test/deterministic-repair-v2.test.mjs','backend/test/ai-admission-shadow-v1.test.mjs','backend/test/field-repair-v1.test.mjs']
          r=subprocess.run(['node','--test']+tests,capture_output=True,text=True,check=True)
          (root/'reports').mkdir(exist_ok=True)
          (root/'reports/validator-controls.tap').write_text(r.stdout)
          (root/'.github/workflows/build-diagnostic-snapshot.yml').unlink()
          patterns=[rb'sk-[A-Za-z0-9_-]{20,}',rb'gh[pousr]_[A-Za-z0-9]{20,}',rb'github_pat_[A-Za-z0-9_]{20,}',rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',rb'AKIA[0-9A-Z]{16}']
          files=sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts)
          for p in files:
              b=p.read_bytes()
              assert not p.name.startswith('.env')
              assert not any(re.search(x,b) for x in patterns), 'Credential-like bytes in '+str(p.relative_to(root))
              if p.suffix=='.md':assert not re.search(rb'(?i)annoma|german-learning-app',b), 'Application name in documentation'
          (root/'SNAPSHOT.sha256').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n' for p in files))
          subprocess.run(['python3','verify_snapshot.py'],check=True)
          print(r.stdout)
          
      - name: Preserve verified snapshot and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'diagnostic-snapshot'
          git config user.email 'diagnostic-snapshot@users.noreply.github.com'
          git add --all
          git commit -m 'Record verified source hashes and offline controls; saved-artifact import pending'
          git push origin HEAD:main
